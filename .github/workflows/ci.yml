name: CI

# Runs on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The real data set is too big for Git, so CI trains on a small fake one.
      # This still runs the whole pipeline: split, model comparison, threshold,
      # plots and saving the model.
      - name: Train on synthetic data (pipeline smoke test)
        run: |
          python scripts/make_synthetic_data.py --out data/synthetic.csv
          python -m src.train --fast --data data/synthetic.csv

      - name: Run tests
        run: pytest -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t fraud-api .

      - name: Start container
        run: docker run -d --name api -p 8000:8000 fraud-api

      - name: Wait until the API is up
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done

      # These checks fail if the committed model file is missing or cannot be loaded.
      - name: Smoke test the running container
        run: |
          curl -sf http://localhost:8000/health | grep -q '"model_loaded":true'
          curl -sf http://localhost:8000/model-info > /dev/null
          curl -sf http://localhost:8000/ | grep -q "Transaction risk desk"
          python -c "import json; print(json.dumps({**{f'V{i}': 0.0 for i in range(1, 29)}, 'Time': 1000.0, 'Amount': 25.0}))" > payload.json
          curl -sf -X POST -H "Content-Type: application/json" -d @payload.json http://localhost:8000/predict

      # The model file is a pickle: it must be loaded with the library versions that
      # trained it. If the image installed different ones, fail loudly here.
      - name: Check the model loaded with matching library versions
        run: |
          if docker logs api 2>&1 | grep -E "VERSION MISMATCH|InconsistentVersionWarning"; then
            echo "::error::Model and library versions differ. Run scripts/pin_serving_versions.py in your training venv and commit requirements-serve.txt."
            exit 1
          fi

      - name: Show container logs if something failed
        if: failure()
        run: docker logs api
